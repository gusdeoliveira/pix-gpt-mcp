name: Trigger auto deployment for pix-mcp

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ master ]
    paths:
    - '**'
    - '.github/workflows/pix-mcp-AutoDeployTrigger-90b3e8c9-958d-4843-88ac-efedd83461d7.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.PIXMCP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.PIXMCP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.PIXMCP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: 
          registryUsername: ${{ secrets.PIXMCP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.PIXMCP_REGISTRY_PASSWORD }}
          containerAppName: pix-mcp
          resourceGroup: gusdeoliveira_group
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


